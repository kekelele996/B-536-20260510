spring:
  application:
    name: study-room-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studyroom?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true}
    username: ${SPRING_DATASOURCE_USERNAME:studyroom_user}
    password: ${SPRING_DATASOURCE_PASSWORD:studyroom_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # 设置 HTTP 响应编码为 UTF-8
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO
    com.studyroom: DEBUG
