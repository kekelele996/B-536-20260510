version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: studyroom-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: studyroom
      MYSQL_USER: studyroom_user
      MYSQL_PASSWORD: studyroom_pass
      LANG: C.UTF-8
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - studyroom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyroom-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studyroom?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: studyroom_user
      SPRING_DATASOURCE_PASSWORD: studyroom_pass
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - studyroom-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyroom-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - studyroom-network

volumes:
  mysql-data:

networks:
  studyroom-network:
    driver: bridge
